name: Applis mobiles (Android et iPhone)
# Construit les applis à chaque changement du dossier mobile/ (ou à la demande).
# Android : fichier .apk à télécharger dans l'onglet Actions (« Artifacts »), installable sur un téléphone de test.
# iPhone : simple vérification que le projet compile (simulateur) ; l'installation sur un vrai iPhone
#          demandera le compte Apple Developer.
on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run sync -- android
      - run: cd android && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CallIt-android-test
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
  ios:
    runs-on: macos-15
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run sync -- ios
      - run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0
