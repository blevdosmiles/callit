name: Appli Android
# Construit les applis à chaque changement du dossier mobile/ (ou à la demande).
# Android : fichier .apk à télécharger dans l'onglet Actions (« Artifacts »), installable sur un téléphone de test.
# iPhone : voir ios.yml (lancé à la demande).
on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run sync -- android
      - run: cd android && ./gradlew --no-daemon assembleDebug bundleRelease
        env: { VERSION_CODE: '${{ github.run_number }}' }
      - uses: actions/upload-artifact@v4
        with:
          name: CallIt-android-test
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      # Version pour Google Play (.aab), à signer avec la clé d'envoi avant de l'envoyer dans la Play Console
      - uses: actions/upload-artifact@v4
        with:
          name: CallIt-google-play-non-signe
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      # Même fichier, déposé dans une pré-version GitHub pour être récupéré et signé hors de GitHub
      # (la clé d'envoi n'est jamais sur GitHub ; le .aab non signé ne contient rien de secret).
      - name: Pré-version Android (non signée)
        working-directory: .
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab CallIt-${{ github.run_number }}-non-signe.aab
          gh release create android-${{ github.run_number }} CallIt-${{ github.run_number }}-non-signe.aab --prerelease \
            --target ${{ github.sha }} --title "Android ${{ github.run_number }} (non signé)" \
            --notes "Fichier technique pour Google Play, à signer avant envoi. Pas à installer."
