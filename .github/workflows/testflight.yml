name: Appli iPhone (TestFlight)
# Fabrique l'appli iPhone sur un Mac de GitHub (gratuit pour un dépôt public)
# et l'envoie sur TestFlight. La signature est faite par Apple (« signature dans le cloud »)
# grâce à une clé d'API App Store Connect rangée dans les secrets du dépôt :
#   APPSTORE_ISSUER_ID, APPSTORE_KEY_ID, APPSTORE_KEY_P8 (contenu du fichier .p8), APPLE_TEAM_ID.
# Sans ces secrets, le Mac vérifie seulement que l'appli compile (aucun envoi).
# Novembre 2026 : GitHub n'attribue aucun Mac à ce dépôt (tâches annulées après 15 min) ;
# l'envoi passe donc par Codemagic (codemagic.yaml). Ce fichier reste en secours.
# Lancement : onglet Actions → « Appli iPhone (TestFlight) » → « Run workflow ».
on:
  workflow_dispatch:
concurrency: { group: testflight, cancel-in-progress: false }
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: mobile } }
    env:
      ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      # Numéro de build toujours croissant (exigé par Apple).
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run sync -- ios

      - name: Vérification (sans compte Apple)
        if: env.KEY_P8 == ''
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0

      - name: Clé App Store Connect
        if: env.KEY_P8 != ''
        run: |
          mkdir -p "$RUNNER_TEMP/cle"
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/cle/AuthKey_$KEY_ID.p8"
          echo "CLE=$RUNNER_TEMP/cle/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Archive signée
        if: env.KEY_P8 != ''
        run: |
          VERSION=$(node -p "require('./package.json').version")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/CallIt.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$CLE" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            archive | tail -n 60
          test "${PIPESTATUS[0]}" -eq 0

      - name: Envoi sur TestFlight
        if: env.KEY_P8 != ''
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/CallIt.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$CLE" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            | tail -n 60
          test "${PIPESTATUS[0]}" -eq 0

      - name: Effacer la clé
        if: always()
        run: rm -rf "$RUNNER_TEMP/cle"
