name: Vérification des images
on:
  schedule:
    - cron: '10 3 * * 0'   # chaque dimanche
  workflow_dispatch:
permissions:
  contents: write
concurrency: depot
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 outils/verifier_images.py
      - run: |
          git config user.name "callit-bot"
          git config user.email "callit-bot@users.noreply.github.com"
          git add data/images.json
          git diff --cached --quiet || git commit -m "Images disponibles (TCGdex et pokemontcg.io)"
          git pull --rebase -q && git push
