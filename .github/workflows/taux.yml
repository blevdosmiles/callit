name: Taux de change BCE
on:
  schedule:
    - cron: '30 15 * * 1-5'   # chaque jour ouvré vers 16 h 30 (heure de Paris), après publication BCE
  workflow_dispatch:
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 outils/maj_taux.py
      - run: |
          git config user.name "callit-bot"
          git config user.email "callit-bot@users.noreply.github.com"
          git add data/rates.json
          git diff --cached --quiet || git commit -m "Taux de change BCE du jour"
          git push
