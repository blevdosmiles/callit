name: Captures pour les stores
# Prend les captures d'écran des fiches Google Play / App Store sur la vraie appli
# et les range dans mobile/store/captures/.
# Lancé à la demande (onglet Actions → « Run workflow ») : chaque passage enregistre plusieurs Mo d'images
# dans le dépôt, on ne le fait donc que pour préparer une fiche de store.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  captures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node mobile/scripts/copier-web.mjs
      - run: |
          (cd mobile/www && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          for l in fr en; do LANGUE=$l node mobile/outils/captures-store.js; done
      - run: |
          git config user.name "callit-bot"
          git config user.email "callit-bot@users.noreply.github.com"
          git add mobile/store/captures
          git diff --cached --quiet || git commit -m "Captures pour les stores"
          git pull --rebase -q && git push
