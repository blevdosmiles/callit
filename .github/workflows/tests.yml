name: Vérifications
# La règle de cote est écrite deux fois (outils/releve_prix.py et app.js) : on vérifie que les deux
# donnent les mêmes résultats, sur les prix du jour et sur des cas limites.
# La base de cartes doit rester corrigée (noms des illustrateurs, cartes mal renseignées) : on vérifie
# que outils/corriger_base.py n'y trouve plus rien à changer.
# Les images de la 2e source ne doivent jamais être celles d'une autre carte : outils/test_images.py (sans réseau).
on:
  pull_request:
    paths:
      - app.js
      - data/cards.json
      - outils/releve_prix.py
      - outils/test_cote.py
      - outils/corriger_base.py
      - outils/corrections.json
      - outils/verifier_images.py
      - outils/test_images.py
      - .github/workflows/tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            app.js
            outils
            data/prix.json
            data/prix_plus.json
          sparse-checkout-cone-mode: false
      - name: La cote de l'appli et celle du relevé sont les mêmes
        run: python3 outils/test_cote.py
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            outils
            data/cards.json
          sparse-checkout-cone-mode: false
      - name: La base de cartes est corrigée
        run: python3 outils/corriger_base.py --verifier
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: outils
          sparse-checkout-cone-mode: false
      - name: Une image de la 2e source n'est jamais celle d'une autre carte
        run: python3 outils/test_images.py
