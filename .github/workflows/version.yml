name: Numéro de version du site
# À chaque changement du code de l'appli sur main, version.json reçoit un nouveau numéro.
# L'appli le relit régulièrement : s'il a changé, le bandeau « Nouvelle version disponible » s'affiche (maj.js).
# Les champs android / ios (version conseillée des applis des stores) se changent à la main.
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.css'
      - index.html
      - 'i18n/**'
      - 'vendor/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency: depot
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Écrire version.json
        run: |
          python3 - <<'PY'
          import json, datetime, os
          v = json.load(open('version.json', encoding='utf-8'))
          v['site'] = os.environ['GITHUB_SHA'][:9]
          v['date'] = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          json.dump(v, open('version.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          PY
      - name: Enregistrer
        run: |
          git config user.name "callit-bot"
          git config user.email "callit-bot@users.noreply.github.com"
          git add version.json
          git commit -m "Numéro de version du site" || exit 0
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && exit 0; sleep $((i*5)); done
          exit 1
