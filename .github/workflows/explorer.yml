name: Exploration sources jeux (temporaire)
on:
  push:
    branches: [claude/project-thread-oqp55j]
    paths: ['.github/workflows/explorer.yml']
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - name: Cardmarket game ids
        run: |
          for g in 1 3 5 7 8 9 10 11 12 13 15 16 18 19 20 21 22 23 24 25; do
            code=$(curl -s -o /tmp/p$g.json -w "%{http_code}" https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_$g.json)
            echo "game $g: $code $(stat -c %s /tmp/p$g.json) $(head -c 400 /tmp/p$g.json | tr '\n' ' ')"
            code2=$(curl -s -o /tmp/g$g.json -w "%{http_code}" https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_$g.json)
            echo "  guide: $code2 $(stat -c %s /tmp/g$g.json)"
          done
          python3 - <<'PY'
          import json,glob
          for f in sorted(glob.glob('/tmp/p*.json')):
              try: d=json.load(open(f))
              except Exception as e: print(f,'err');continue
              ps=d.get('products') or []
              print(f,len(ps), ps[:2] if ps else str(d)[:200])
          PY
      - name: Scryfall bulk
        run: |
          curl -s -H 'User-Agent: CallIt/0.1' -H 'Accept: application/json' https://api.scryfall.com/bulk-data | python3 -c "import json,sys;[print(b['type'],b['size'],b['download_uri']) for b in json.load(sys.stdin)['data']]"
          curl -s -H 'User-Agent: CallIt/0.1' 'https://api.scryfall.com/cards/lea/161' | head -c 3000; echo
      - name: YGOPRODeck
        run: |
          curl -s 'https://db.ygoprodeck.com/api/v7/cardinfo.php?name=Dark%20Magician' | head -c 3000; echo
          curl -s -o /tmp/y.json 'https://db.ygoprodeck.com/api/v7/cardinfo.php' ; ls -la /tmp/y.json
          curl -s 'https://db.ygoprodeck.com/api/v7/cardinfo.php?name=Dark%20Magician&language=fr' | head -c 800; echo
          curl -s 'https://db.ygoprodeck.com/api/v7/cardsets.php' | head -c 500; echo
          curl -sI 'https://images.ygoprodeck.com/images/cards_small/46986414.jpg' | head -5
      - name: One Piece
        run: |
          curl -s https://optcgapi.com/api/allSetCards/ -o /tmp/op.json; ls -la /tmp/op.json; head -c 1500 /tmp/op.json; echo
          curl -s https://optcgapi.com/api/allSTCards/ | head -c 300; echo
          curl -s https://api.github.com/repos/buhbbl/punk-records | head -c 400; echo
          curl -s https://api.github.com/repos/arjunkai/optcg-api | head -c 400; echo
