name: Exploration sources jeux (temporaire)
on:
  push:
    branches: [claude/project-thread-oqp55j]
    paths: ['.github/workflows/explorer.yml']
jobs:
  explore:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Cardmarket autres ids et fichiers
        continue-on-error: true
        run: |
          for g in 2 4 14 17 26 27; do echo "game $g: $(curl -s -o /tmp/p.json -w '%{http_code}' https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_$g.json) $(head -c 300 /tmp/p.json)"; done
          for f in productList/expansions_18.json productList/products_nonsingles_18.json expansions/expansions_18.json productList/expansions.json; do echo "$f: $(curl -s -o /tmp/e.json -w '%{http_code}' https://downloads.s3.cardmarket.com/productCatalog/$f) $(head -c 600 /tmp/e.json)"; done
          curl -s -o /tmp/g18.json https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_18.json; head -c 700 /tmp/g18.json; echo
          curl -s -o /tmp/p3.json https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_3.json
          python3 -c "
          import json,collections
          d=json.load(open('/tmp/p3.json'))['products']
          print(len(d), len({p['idMetacard'] for p in d}), len({p['idExpansion'] for p in d}))
          print([p for p in d if p['name'].startswith('Dark Magician')][:6])
          "
      - name: Scryfall bulk
        continue-on-error: true
        run: |
          curl -s -H 'User-Agent: CallIt/0.1' -H 'Accept: application/json' https://api.scryfall.com/bulk-data | python3 -c "import json,sys;[print(b['type'],b.get('size'),b['download_uri']) for b in json.load(sys.stdin)['data']]"
          curl -s -H 'User-Agent: CallIt/0.1' 'https://api.scryfall.com/cards/lea/161' | head -c 3000; echo
      - name: YGOPRODeck
        continue-on-error: true
        run: |
          curl -s 'https://db.ygoprodeck.com/api/v7/cardinfo.php?name=Dark%20Magician' | head -c 3000; echo
          curl -s -o /tmp/y.json 'https://db.ygoprodeck.com/api/v7/cardinfo.php' ; ls -la /tmp/y.json
          curl -s 'https://db.ygoprodeck.com/api/v7/cardinfo.php?name=Dark%20Magician&language=fr' | head -c 800; echo
          curl -s 'https://db.ygoprodeck.com/api/v7/cardsets.php' | head -c 500; echo
          curl -sI 'https://images.ygoprodeck.com/images/cards_small/46986414.jpg' | head -5
      - name: One Piece
        continue-on-error: true
        run: |
          curl -s https://optcgapi.com/api/allSetCards/ -o /tmp/op.json; ls -la /tmp/op.json; head -c 1500 /tmp/op.json; echo
          curl -s https://optcgapi.com/api/allSTCards/ | head -c 300; echo
          curl -s https://api.github.com/repos/buhbbl/punk-records | head -c 400; echo
          curl -s https://api.github.com/repos/arjunkai/optcg-api | head -c 400; echo
      - name: One Piece officiel
        continue-on-error: true
        run: |
          curl -s https://en.onepiece-cardgame.com/robots.txt | head -30; echo
          curl -sI https://en.onepiece-cardgame.com/images/cardlist/card/OP01-001.png | head -5
          curl -s https://api.github.com/search/repositories?q=one+piece+card+game+json | python3 -c "import json,sys;[print(r['full_name'],r['stargazers_count'],(r.get('license') or {}).get('spdx_id'),r['description']) for r in json.load(sys.stdin).get('items',[])[:10]]"
