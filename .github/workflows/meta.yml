name: Méta Pokémon (Limitless TCG)
on:
  schedule:
    - cron: '30 5 * * *'   # chaque matin
  workflow_dispatch:
permissions:
  contents: write
concurrency: depot-meta
jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 outils/meta_pkm.py
      - run: |
          git config user.name "callit-bot"
          git config user.email "callit-bot@users.noreply.github.com"
          git add data/meta
          git diff --cached --quiet || git commit -m "Méta Pokémon : decks du moment (Limitless TCG)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
