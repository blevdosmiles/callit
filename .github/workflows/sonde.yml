name: Sonde cartes manquantes
on:
  workflow_dispatch:
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL --retry 3 -o /tmp/produits.json https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_6.json
          curl -fsSL --retry 3 -o /tmp/guide.json https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_6.json
          head -c 400 /tmp/produits.json; echo
      - run: python3 outils/sonde_manquantes.py /tmp/produits.json /tmp/guide.json
