name: Relevé quotidien des prix
# Chaque jour : télécharge le guide de prix public de Cardmarket, le vérifie, puis
#   - écrit les prix du jour lus par l'appli (data/prix.json, data/prix_plus.json) ;
#   - ajoute la cote du jour à l'historique (historique/) ;
#   - range l'archive complète du jour dans les « releases » du dépôt (prix-AAAA-MM), hors du site.
# Trois passages par jour : si le premier est sauté ou si le guide arrive en retard, le suivant rattrape.
# Un passage qui n'a rien de nouveau ne change rien. En cas d'échec, un ticket « Relevé des prix en échec »
# est ouvert dans le dépôt ; il se ferme tout seul au relevé réussi suivant.
# Quand la règle de cote change (outils/releve_prix.py), l'historique est refait tout seul à partir des archives.
on:
  schedule:
    - cron: '20 6 * * *'
    - cron: '20 10 * * *'
    - cron: '20 16 * * *'
  workflow_dispatch:
    inputs:
      essai:
        description: 'Essai : vérifier et afficher le bilan, sans rien enregistrer'
        type: boolean
        default: false
      forcer:
        description: 'Enregistrer même si une vérification de cohérence échoue (après contrôle)'
        type: boolean
        default: false
      refaire:
        description: 'Refaire tout l''historique à partir des archives (après un changement de règle)'
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency: depot
env:
  GUIDE: https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_6.json
  TICKET: Relevé des prix en échec
jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Télécharger le guide de prix Cardmarket
        run: |
          for essai in 1 2 3 4 5; do
            if curl -fsSL --max-time 300 -o /tmp/guide.json "$GUIDE"; then break; fi
            echo "Téléchargement raté (essai $essai), nouvel essai dans une minute"
            rm -f /tmp/guide.json
            sleep 60
          done
          test -s /tmp/guide.json
      - name: Vérifier et enregistrer les prix
        id: releve
        run: python3 outils/releve_prix.py /tmp/guide.json --archive /tmp/archive ${{ inputs.essai && '--essai' || '' }} ${{ inputs.forcer && '--forcer' || '' }}
      - name: Publier les prix du jour
        if: ${{ steps.releve.outputs.nouveau == 'oui' }}
        run: |
          git config user.name "callit-bot"
          git config user.email "callit-bot@users.noreply.github.com"
          git add data/prix.json data/prix_plus.json historique
          if git diff --cached --quiet; then echo "Rien de nouveau à publier"; exit 0; fi
          git commit -q -m "Relevé des prix du ${{ steps.releve.outputs.jour }}"
          for essai in 1 2 3 4 5; do
            if git pull --rebase -q && git push -q; then echo "Publié"; exit 0; fi
            sleep 15
          done
          echo "Impossible de publier le relevé"; exit 1
      - name: Archiver le relevé complet
        if: ${{ !inputs.essai }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fichier=$(ls /tmp/archive/releve-*.json.gz)
          nom=$(basename "$fichier")
          jour="${{ steps.releve.outputs.jour }}"
          etiquette="prix-${jour:0:7}"
          if ! gh release view "$etiquette" >/dev/null 2>&1; then
            gh release create "$etiquette" --latest=false --title "Relevés de prix ${jour:0:7}" \
              --notes "Archive des relevés quotidiens : un fichier par jour, avec tous les produits et toutes les mesures du guide de prix public de Cardmarket. Sert à refaire l'historique ou à vérifier un prix. Rangée ici pour ne pas alourdir le site."
          fi
          if [ "${{ steps.releve.outputs.nouveau }}" = "oui" ] || ! gh release view "$etiquette" --json assets --jq '.assets[].name' | grep -qx "$nom"; then
            gh release upload "$etiquette" "$fichier" --clobber
            echo "Archive rangée : $etiquette / $nom"
          else
            echo "Archive du jour déjà rangée"
          fi
      - name: Refaire l'historique à partir des archives
        # Tout seul quand la règle de cote a changé (le script le signale), ou à la demande
        if: ${{ steps.releve.outputs.refaire == 'oui' || inputs.refaire }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/archives
          for etiquette in $(gh release list --limit 500 --json tagName --jq '.[].tagName' | grep '^prix-' || true); do
            gh release download "$etiquette" --dir /tmp/archives --pattern 'releve-*.json.gz' --clobber
          done
          ls /tmp/archives | wc -l
          python3 outils/releve_prix.py --refaire /tmp/archives ${{ inputs.essai && '--essai' || '' }} ${{ inputs.forcer && '--forcer' || '' }}
          git config user.name "callit-bot"
          git config user.email "callit-bot@users.noreply.github.com"
          git add historique
          if git diff --cached --quiet; then echo "Historique inchangé"; exit 0; fi
          git commit -q -m "Historique des prix refait à partir des archives"
          for essai in 1 2 3 4 5; do
            if git pull --rebase -q && git push -q; then echo "Publié"; exit 0; fi
            sleep 15
          done
          echo "Impossible de publier l'historique"; exit 1
      - name: Vérifier que le guide est récent
        # Le guide lui-même, et ses moyennes de vente (un guide neuf peut ne renouveler que les offres)
        if: ${{ !inputs.essai }}
        run: |
          retard="${{ steps.releve.outputs.retard }}"
          ventes="${{ steps.releve.outputs.retard_ventes }}"
          if [ "${retard:-0}" -ge 2 ]; then
            echo "Le dernier guide de Cardmarket date de $retard jours : les prix ne sont plus à jour."
            exit 1
          fi
          if [ "${ventes:-0}" -ge 2 ]; then
            echo "Les moyennes de vente du guide Cardmarket n'ont pas changé depuis $ventes jours : la cote ne suit plus les ventes."
            exit 1
          fi
      - name: Fermer le ticket d'échec s'il y en a un
        if: ${{ success() && !inputs.essai }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          numero=$(gh issue list --state open --search "\"$TICKET\" in:title" --json number --jq '.[0].number' || true)
          if [ -n "$numero" ]; then
            gh issue close "$numero" --comment "Relevé du ${{ steps.releve.outputs.jour }} réussi : les prix sont de nouveau à jour." || true
          fi
      - name: Ouvrir un ticket en cas d'échec
        if: ${{ failure() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          numero=$(gh issue list --state open --search "\"$TICKET\" in:title" --json number --jq '.[0].number' || true)
          if [ -z "$numero" ]; then
            gh issue create --title "$TICKET" \
              --body "Le relevé automatique des prix a signalé un problème le $(date -u +%d/%m/%Y) : relevé en échec, ou guide de Cardmarket qui n'est plus à jour. Les prix affichés sont ceux du dernier relevé enregistré. Détail : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          fi
